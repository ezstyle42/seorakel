[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew", "msi"]

# Homebrew tap publishing is disabled: it requires a HOMEBREW_TAP_TOKEN
# secret (a GitHub PAT with write access to ezstyle42/homebrew-tap) which
# is not configured in this repository. The formula file (seorakel.rb) is
# still built and uploaded as a release asset for manual installation.
tap = "ezstyle42/homebrew-tap"

# Publish jobs to run in CI
publish-jobs = []

# Whether to run cargo test during builds
cargo-test = true

# Target platforms to build apps for (Rust target-triple syntax)
# Note: aarch64-apple-darwin (Apple Silicon) is excluded because the
# GitHub-hosted macos-14 runner fleet is saturated/unavailable in this
# environment and the job gets cancelled after 15 minutes without logs.
targets = ["aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[dist.github-custom-runners]
global = "ubuntu-latest"
