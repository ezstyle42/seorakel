[package]
name = "seorakel"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/ezstyle42/seorakel"
license = "MIT"
description = "Desktop dashboard for weekly SEO audit XML reports"
authors = ["ezstyle42"]
homepage = "https://github.com/ezstyle42/seorakel"

[package.metadata.wix]
upgrade-guid = "5F66335D-FC11-44CA-A705-63C812A423B6"
path-guid = "6E244396-BEAB-4EBF-B3A3-A1EB1D9F89B0"
license = false
eula = false

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "persistence", "ron", "wayland", "x11"] }
egui = "0.37"
egui_plot = "0.38.0"
env_logger = "0.11.11"
log = "0.4.34"
open = "5.4.5"
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
[lib]
name = "seorakel"
path = "src/lib.rs"

[[bin]]
name = "seorakel"
path = "src/main.rs"
[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
